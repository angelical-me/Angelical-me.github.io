<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angelical Scripts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
            border-bottom: 2px solid #404040;
        }
        h1 {
            color: #4ec9b0;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .tagline {
            color: #858585;
            font-size: 0.9em;
        }
        .section {
            background: #252526;
            border: 1px solid #404040;
            border-radius: 5px;
            padding: 20px;
        }
        .section h2 {
            color: #4ec9b0;
            margin-bottom: 15px;
            font-size: 1.1em;
            border-bottom: 1px solid #404040;
            padding-bottom: 10px;
        }
        .script-item {
            background: #1e1e1e;
            border: 1px solid #404040;
            border-radius: 5px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .script-name {
            color: #4ec9b0;
            font-weight: bold;
            font-size: 0.95em;
        }
        .script-url {
            color: #858585;
            font-size: 0.8em;
            word-break: break-all;
            margin: 5px 0;
            flex-basis: 100%;
        }
        .script-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        button {
            background: #4ec9b0;
            color: #1e1e1e;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            transition: background 0.3s;
            font-size: 0.85em;
        }
        button:hover {
            background: #6dd4c4;
        }
        button.raw {
            background: #007acc;
        }
        button.raw:hover {
            background: #0098ff;
        }
        .empty-message {
            color: #858585;
            text-align: center;
            padding: 20px;
        }
        .loading {
            color: #858585;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Angelical Scripts</h1>
            <p class="tagline">Host and share Lua scripts for Roblox</p>
        </header>

        <div class="section">
            <h2>Available Scripts</h2>
            <div id="scriptsList" class="loading">Loading scripts...</div>
        </div>
    </div>

    <script>
        const GITHUB_USER = 'angelical-me';
        const GITHUB_REPO = 'Angelical-me.github.io';
        const SCRIPTS_PATH = 'scripts';

        async function loadScripts() {
            try {
                const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${SCRIPTS_PATH}`;
                const response = await fetch(url);
                
                const scriptsList = document.getElementById('scriptsList');
                
                if (!response.ok) {
                    if (response.status === 404) {
                        scriptsList.innerHTML = '<div class="empty-message">No scripts yet. Create a /scripts/ folder and add .lua files to this repository!</div>';
                    } else {
                        scriptsList.innerHTML = '<div class="empty-message">Error loading scripts</div>';
                    }
                    return;
                }
                
                const files = await response.json();
                const luaFiles = Array.isArray(files) ? files.filter(f => f.name.endsWith('.lua') && f.type === 'file') : [];
                
                if (luaFiles.length === 0) {
                    scriptsList.innerHTML = '<div class="empty-message">No scripts yet. Add .lua files to the /scripts/ folder!</div>';
                    return;
                }
                
                scriptsList.innerHTML = luaFiles.map((file) => {
                    const baseUrl = 'https://angelical-me.github.io';
                    const scriptUrl = `${baseUrl}/${SCRIPTS_PATH}/${file.name}`;
                    const rawUrl = file.download_url;
                    return `
                        <div class="script-item">
                            <div>
                                <div class="script-name">📄 ${file.name}</div>
                                <div class="script-url">${scriptUrl}</div>
                            </div>
                            <div class="script-actions">
                                <button class="raw" onclick="copyToClipboard('${scriptUrl}')">Copy URL</button>
                                <button class="raw" onclick="window.open('${rawUrl}', '_blank')">View Raw</button>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading scripts:', error);
                document.getElementById('scriptsList').innerHTML = '<div class="empty-message">Error loading scripts</div>';
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('URL copied to clipboard!');
            }).catch(() => {
                alert('Failed to copy URL');
            });
        }

        // Load scripts on page load
        loadScripts();
    </script>
</body>
</html>
