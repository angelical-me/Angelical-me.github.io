<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angelical Scripts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            background: linear-gradient(135deg, #1a0033 0%, #330066 50%, #1a0033 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            color: #d4d4d4;
            min-height: 100vh;
            padding: 20px;
        }
        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 50px;
            padding: 40px 0;
            animation: fadeInDown 0.8s ease;
        }
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        h1 {
            color: #ff1493;
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 20, 147, 0.5);
            letter-spacing: 2px;
            font-weight: bold;
        }
        .scripts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            animation: fadeInUp 0.8s ease 0.2s both;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .script-card {
            background: rgba(40, 20, 60, 0.8);
            border: 2px solid #ff1493;
            border-radius: 12px;
            padding: 25px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            animation: slideIn 0.5s ease;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .script-card:hover {
            transform: translateY(-8px);
            border-color: #ff69b4;
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.4);
            background: rgba(50, 30, 80, 0.9);
        }
        .script-name {
            color: #ff1493;
            font-weight: bold;
            font-size: 1.3em;
            margin-bottom: 15px;
            word-break: break-word;
        }
        .script-url {
            color: #b8b8b8;
            font-size: 0.85em;
            margin-bottom: 15px;
            word-break: break-all;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 6px;
            border-left: 3px solid #ff1493;
        }
        .loadstring-code {
            background: #0a0a0a;
            color: #00ff00;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.8em;
            margin-bottom: 15px;
            word-break: break-all;
            border: 1px solid #333;
            font-family: 'Courier New', monospace;
            max-height: 80px;
            overflow-y: auto;
        }
        .script-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            flex: 1;
            min-width: 120px;
            background: linear-gradient(135deg, #ff1493 0%, #ff69b4 100%);
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            transition: all 0.3s ease;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.6);
        }
        button:active {
            transform: scale(0.95);
        }
        button.loadstring-btn {
            background: linear-gradient(135deg, #00ff00 0%, #00cc00 100%);
            color: #000;
        }
        button.loadstring-btn:hover {
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.6);
        }
        .empty-message {
            color: #ff1493;
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
        }
        .loading {
            color: #ff1493;
            text-align: center;
            padding: 40px;
            font-size: 1.1em;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        .copy-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ff1493;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            animation: slideInRight 0.5s ease;
            z-index: 1000;
            font-weight: bold;
        }
        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Please Copy Our Scripts Below!</h1>
        </header>

        <div class="scripts-grid" id="scriptsList">
            <div class="loading">Loading scripts...</div>
        </div>
    </div>

    <script>
        const GITHUB_USER = 'angelical-me';
        const GITHUB_REPO = 'Angelical-me.github.io';
        const SCRIPTS_PATH = 'scripts';

        async function loadScripts() {
            try {
                const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${SCRIPTS_PATH}`;
                const response = await fetch(url);
                
                const scriptsList = document.getElementById('scriptsList');
                
                if (!response.ok) {
                    if (response.status === 404) {
                        scriptsList.innerHTML = '<div class="empty-message">No scripts available yet!</div>';
                    } else {
                        scriptsList.innerHTML = '<div class="empty-message">Error loading scripts</div>';
                    }
                    return;
                }
                
                const files = await response.json();
                const luaFiles = Array.isArray(files) ? files.filter(f => f.name.endsWith('.lua') && f.type === 'file') : [];
                
                if (luaFiles.length === 0) {
                    scriptsList.innerHTML = '<div class="empty-message">No scripts available yet!</div>';
                    return;
                }
                
                scriptsList.innerHTML = luaFiles.map((file, index) => {
                    const scriptName = file.name;
                    const baseUrl = 'https://angelical-me.github.io';
                    const scriptUrl = `${baseUrl}/${SCRIPTS_PATH}/${scriptName}`;
                    const loadstringCode = `loadstring(game:HttpGet("${scriptUrl}"))()`;
                    const rawUrl = file.download_url;
                    
                    return `
                        <div class="script-card" style="animation-delay: ${index * 0.1}s">
                            <div class="script-name">${scriptName}</div>
                            <div class="script-url">${scriptUrl}</div>
                            <div class="loadstring-code">${escapeHtml(loadstringCode)}</div>
                            <div class="script-actions">
                                <button class="loadstring-btn" onclick="copyLoadstring('${escapeJs(loadstringCode)}')">Copy Loadstring</button>
                                <button onclick="copyUrl('${escapeJs(scriptUrl)}')">Copy URL</button>
                                <button onclick="window.open('${rawUrl}', '_blank')">View Raw</button>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading scripts:', error);
                document.getElementById('scriptsList').innerHTML = '<div class="empty-message">Error loading scripts</div>';
            }
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function escapeJs(text) {
            return text.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n').replace(/\r/g, '\\r');
        }

        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'copy-notification';
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'slideOutRight 0.5s ease';
                setTimeout(() => notification.remove(), 500);
            }, 2000);
        }

        function copyLoadstring(text) {
            navigator.clipboard.writeText(text).then(() => {
                showNotification('Loadstring copied!');
            }).catch(() => {
                showNotification('Failed to copy');
            });
        }

        function copyUrl(text) {
            navigator.clipboard.writeText(text).then(() => {
                showNotification('URL copied!');
            }).catch(() => {
                showNotification('Failed to copy');
            });
        }

        // Add slideOutRight animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideOutRight {
                from {
                    opacity: 1;
                    transform: translateX(0);
                }
                to {
                    opacity: 0;
                    transform: translateX(100px);
                }
            }
        `;
        document.head.appendChild(style);

        // Load scripts on page load
        loadScripts();
    </script>
</body>
</html>
