<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angelical Scripts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
            border-bottom: 2px solid #404040;
        }
        h1 {
            color: #4ec9b0;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .tagline {
            color: #858585;
            font-size: 0.9em;
        }
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        @media (max-width: 1000px) {
            .content {
                grid-template-columns: 1fr;
            }
        }
        .section {
            background: #252526;
            border: 1px solid #404040;
            border-radius: 5px;
            padding: 20px;
        }
        .section h2 {
            color: #4ec9b0;
            margin-bottom: 15px;
            font-size: 1.1em;
            border-bottom: 1px solid #404040;
            padding-bottom: 10px;
        }
        textarea {
            width: 100%;
            height: 400px;
            background: #1e1e1e;
            color: #d4d4d4;
            border: 1px solid #404040;
            border-radius: 4px;
            padding: 15px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 0.9em;
            resize: vertical;
            margin-bottom: 15px;
        }
        textarea:focus {
            outline: none;
            border-color: #4ec9b0;
            box-shadow: 0 0 5px rgba(78, 201, 176, 0.3);
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            background: #1e1e1e;
            color: #d4d4d4;
            border: 1px solid #404040;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            margin-bottom: 15px;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: #4ec9b0;
        }
        button {
            background: #4ec9b0;
            color: #1e1e1e;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            transition: background 0.3s;
            width: 100%;
        }
        button:hover {
            background: #6dd4c4;
        }
        button.delete {
            background: #d94949;
            width: auto;
            padding: 5px 10px;
            font-size: 0.8em;
            margin-top: 10px;
        }
        button.delete:hover {
            background: #ff6b6b;
        }
        .script-item {
            background: #1e1e1e;
            border: 1px solid #404040;
            border-radius: 5px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .script-name {
            color: #4ec9b0;
            font-weight: bold;
            font-size: 0.95em;
            word-break: break-all;
        }
        .script-url {
            color: #858585;
            font-size: 0.8em;
            margin-top: 5px;
            word-break: break-all;
        }
        .script-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .script-actions button {
            flex: 1;
            min-width: 100px;
            padding: 6px 12px;
            font-size: 0.85em;
        }
        .copy-btn {
            background: #007acc;
        }
        .copy-btn:hover {
            background: #0098ff;
        }
        .empty-message {
            color: #858585;
            text-align: center;
            padding: 20px;
        }
        .success-msg, .error-msg {
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            display: none;
        }
        .success-msg {
            background: #155724;
            color: #d4edda;
        }
        .error-msg {
            background: #721c24;
            color: #f8d7da;
        }
        .setup-section {
            background: #ffeb3b;
            color: #000;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .setup-section h3 {
            margin-bottom: 10px;
        }
        .setup-section p {
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        .code-block {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            overflow-x: auto;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Angelical Scripts</h1>
            <p class="tagline">Host and share Lua scripts for Roblox</p>
        </header>

        <div id="setupAlert"></div>

        <div class="content">
            <div class="section">
                <h2>Upload New Script</h2>
                <div class="success-msg" id="successMsg">✓ Script uploaded successfully!</div>
                <div class="error-msg" id="errorMsg"></div>
                <input type="text" id="scriptName" placeholder="Script name (e.g., anti-logger.lua)">
                <textarea id="scriptContent" placeholder="Paste your Lua script here..."></textarea>
                <button onclick="uploadScript()">Upload Script</button>
            </div>

            <div class="section">
                <h2>Your Scripts</h2>
                <div id="scriptsList"></div>
            </div>
        </div>
    </div>

    <script>
        const GITHUB_TOKEN = localStorage.getItem('github_token');
        const GITHUB_USER = 'angelical-me';
        const GITHUB_REPO = 'Angelical-me.github.io';
        const SCRIPTS_PATH = 'scripts';

        // Setup check
        function checkSetup() {
            if (!GITHUB_TOKEN) {
                const setupDiv = document.getElementById('setupAlert');
                setupDiv.innerHTML = `
                    <div class="setup-section">
                        <h3>⚙️ Setup Required</h3>
                        <p>To enable file uploads, you need to configure your GitHub Personal Access Token (PAT).</p>
                        <p><strong>Steps:</strong></p>
                        <ol style="margin-left: 20px;">
                            <li>Go to <a href="https://github.com/settings/tokens" target="_blank" style="color: #0066cc;">GitHub Settings → Personal Access Tokens</a></li>
                            <li>Click "Generate new token (classic)"</li>
                            <li>Select scopes: <code>repo</code> (full control of private repositories)</li>
                            <li>Generate and copy the token</li>
                            <li>Paste it below:</li>
                        </ol>
                        <input type="password" id="tokenInput" placeholder="Paste your GitHub PAT here...">
                        <button onclick="saveToken()" style="margin-top: 10px;">Save Token</button>
                        <p style="margin-top: 10px; font-size: 0.85em;"><strong>⚠️ Security:</strong> Your token is stored locally in your browser. Never share it with others.</p>
                    </div>
                `;
            } else {
                loadScripts();
            }
        }

        function saveToken() {
            const token = document.getElementById('tokenInput').value.trim();
            if (!token) {
                alert('Please enter a token');
                return;
            }
            localStorage.setItem('github_token', token);
            location.reload();
        }

        // Load scripts from GitHub
        async function loadScripts() {
            try {
                const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${SCRIPTS_PATH}`;
                const response = await fetch(url);
                
                const scriptsList = document.getElementById('scriptsList');
                
                if (!response.ok) {
                    if (response.status === 404) {
                        scriptsList.innerHTML = '<div class="empty-message">No scripts yet. Upload one above!</div>';
                    } else {
                        scriptsList.innerHTML = '<div class="empty-message">Error loading scripts</div>';
                    }
                    return;
                }
                
                const files = await response.json();
                const luaFiles = Array.isArray(files) ? files.filter(f => f.name.endsWith('.lua')) : [];
                
                if (luaFiles.length === 0) {
                    scriptsList.innerHTML = '<div class="empty-message">No scripts yet. Upload one above!</div>';
                    return;
                }
                
                scriptsList.innerHTML = luaFiles.map((file) => {
                    const baseUrl = 'https://angelical-me.github.io';
                    const scriptUrl = `${baseUrl}/${SCRIPTS_PATH}/${file.name}`;
                    const rawUrl = file.download_url;
                    return `
                        <div class="script-item">
                            <div class="script-name">📄 ${file.name}</div>
                            <div class="script-url">📍 ${scriptUrl}</div>
                            <div class="script-actions">
                                <button class="copy-btn" onclick="copyToClipboard('${scriptUrl}')">Copy URL</button>
                                <button class="delete" onclick="deleteScript('${file.name}')">Delete</button>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading scripts:', error);
            }
        }

        async function uploadScript() {
            const name = document.getElementById('scriptName').value.trim();
            const content = document.getElementById('scriptContent').value;
            
            if (!name) {
                showError('Please enter a script name!');
                return;
            }
            
            if (!content.trim()) {
                showError('Please enter script content!');
                return;
            }

            if (!GITHUB_TOKEN) {
                showError('Please configure your GitHub token first');
                return;
            }
            
            // Ensure name ends with .lua
            const finalName = name.endsWith('.lua') ? name : name + '.lua';
            
            try {
                const path = `${SCRIPTS_PATH}/${finalName}`;
                const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}`;
                
                // Encode content to base64
                const encodedContent = btoa(unescape(encodeURIComponent(content)));
                
                // Get the current file (if it exists) to get its SHA
                let sha = null;
                try {
                    const getResponse = await fetch(url, {
                        headers: {
                            'Authorization': `token ${GITHUB_TOKEN}`,
                            'Content-Type': 'application/json'
                        }
                    });
                    if (getResponse.ok) {
                        const data = await getResponse.json();
                        sha = data.sha;
                    }
                } catch (e) {
                    // File doesn't exist yet
                }
                
                // Upload the file
                const response = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Upload script: ${finalName}`,
                        content: encodedContent,
                        ...(sha && { sha })
                    })
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    showError(`Upload failed: ${errorData.message || 'Unknown error'}`);
                    return;
                }
                
                showSuccess('Script uploaded successfully!');
                document.getElementById('scriptName').value = '';
                document.getElementById('scriptContent').value = '';
                
                // Wait a moment for GitHub to process, then reload
                setTimeout(loadScripts, 1500);
            } catch (error) {
                console.error('Upload error:', error);
                showError(`Upload failed: ${error.message}`);
            }
        }

        async function deleteScript(name) {
            if (!confirm(`Delete ${name}?`)) return;
            
            if (!GITHUB_TOKEN) {
                showError('Please configure your GitHub token first');
                return;
            }
            
            try {
                const path = `${SCRIPTS_PATH}/${name}`;
                const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}`;
                
                // Get the file SHA
                const getResponse = await fetch(url, {
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`
                    }
                });
                
                if (!getResponse.ok) {
                    showError('Could not find file to delete');
                    return;
                }
                
                const data = await getResponse.json();
                
                // Delete the file
                const deleteResponse = await fetch(url, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Delete script: ${name}`,
                        sha: data.sha
                    })
                });
                
                if (!deleteResponse.ok) {
                    showError('Failed to delete script');
                    return;
                }
                
                showSuccess('Script deleted!');
                setTimeout(loadScripts, 1500);
            } catch (error) {
                console.error('Delete error:', error);
                showError(`Delete failed: ${error.message}`);
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('URL copied to clipboard!');
            });
        }

        function showSuccess(msg) {
            const el = document.getElementById('successMsg');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 3000);
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 3000);
        }

        // Check if URL is requesting a script (for raw script access)
        function handleScriptRequest() {
            const path = window.location.pathname;
            const match = path.match(/\/scripts\/([^/]+)$/);
            
            if (match) {
                const scriptName = decodeURIComponent(match[1]);
                // Redirect to raw GitHub content
                const rawUrl = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/scripts/${scriptName}`;
                window.location.href = rawUrl;
            }
        }

        // Initialize
        handleScriptRequest();
        checkSetup();
    </script>
</body>
</html>
