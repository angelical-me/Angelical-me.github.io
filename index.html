<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angelical Scripts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
            border-bottom: 2px solid #404040;
        }
        h1 {
            color: #4ec9b0;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .tagline {
            color: #858585;
            font-size: 0.9em;
        }
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        @media (max-width: 1000px) {
            .content {
                grid-template-columns: 1fr;
            }
        }
        .section {
            background: #252526;
            border: 1px solid #404040;
            border-radius: 5px;
            padding: 20px;
        }
        .section h2 {
            color: #4ec9b0;
            margin-bottom: 15px;
            font-size: 1.1em;
            border-bottom: 1px solid #404040;
            padding-bottom: 10px;
        }
        textarea {
            width: 100%;
            height: 400px;
            background: #1e1e1e;
            color: #d4d4d4;
            border: 1px solid #404040;
            border-radius: 4px;
            padding: 15px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 0.9em;
            resize: vertical;
            margin-bottom: 15px;
        }
        textarea:focus {
            outline: none;
            border-color: #4ec9b0;
            box-shadow: 0 0 5px rgba(78, 201, 176, 0.3);
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            background: #1e1e1e;
            color: #d4d4d4;
            border: 1px solid #404040;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            margin-bottom: 15px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #4ec9b0;
        }
        button {
            background: #4ec9b0;
            color: #1e1e1e;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            transition: background 0.3s;
            width: 100%;
        }
        button:hover {
            background: #6dd4c4;
        }
        button.delete {
            background: #d94949;
            width: auto;
            padding: 5px 10px;
            font-size: 0.8em;
            margin-top: 10px;
        }
        button.delete:hover {
            background: #ff6b6b;
        }
        .script-item {
            background: #1e1e1e;
            border: 1px solid #404040;
            border-radius: 5px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .script-name {
            color: #4ec9b0;
            font-weight: bold;
            font-size: 0.95em;
            word-break: break-all;
        }
        .script-url {
            color: #858585;
            font-size: 0.8em;
            margin-top: 5px;
            word-break: break-all;
        }
        .script-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .script-actions button {
            flex: 1;
            min-width: 100px;
            padding: 6px 12px;
            font-size: 0.85em;
        }
        .copy-btn {
            background: #007acc;
        }
        .copy-btn:hover {
            background: #0098ff;
        }
        .empty-message {
            color: #858585;
            text-align: center;
            padding: 20px;
        }
        .success-msg {
            background: #155724;
            color: #d4edda;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Angelical Scripts</h1>
            <p class="tagline">Host and share Lua scripts for Roblox</p>
        </header>

        <div class="content">
            <div class="section">
                <h2>Upload New Script</h2>
                <div class="success-msg" id="successMsg">Script uploaded successfully!</div>
                <input type="text" id="scriptName" placeholder="Script name (e.g., anti-logger.lua)">
                <textarea id="scriptContent" placeholder="Paste your Lua script here..."></textarea>
                <button onclick="uploadScript()">Upload Script</button>
            </div>

            <div class="section">
                <h2>Your Scripts</h2>
                <div id="scriptsList"></div>
            </div>
        </div>
    </div>

    <script>
        // Load scripts from localStorage
        function loadScripts() {
            const scriptsList = document.getElementById('scriptsList');
            const scripts = JSON.parse(localStorage.getItem('scripts') || '{}');
            const scriptNames = Object.keys(scripts);
            
            if (scriptNames.length === 0) {
                scriptsList.innerHTML = '<div class="empty-message">No scripts yet. Upload one above!</div>';
                return;
            }
            
            scriptsList.innerHTML = scriptNames.map((name) => {
                const baseUrl = window.location.origin + window.location.pathname.replace('index.html', '');
                const scriptUrl = baseUrl + 'scripts/' + name;
                return `
                    <div class="script-item">
                        <div class="script-name">📄 ${name}</div>
                        <div class="script-url">📍 ${scriptUrl}</div>
                        <div class="script-actions">
                            <button class="copy-btn" onclick="copyToClipboard('${scriptUrl}')">Copy URL</button>
                            <button class="delete" onclick="deleteScript('${name}')">Delete</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function uploadScript() {
            const name = document.getElementById('scriptName').value.trim();
            const content = document.getElementById('scriptContent').value;
            
            if (!name) {
                alert('Please enter a script name!');
                return;
            }
            
            if (!content.trim()) {
                alert('Please enter script content!');
                return;
            }
            
            // Ensure name ends with .lua
            const finalName = name.endsWith('.lua') ? name : name + '.lua';
            
            const scripts = JSON.parse(localStorage.getItem('scripts') || '{}');
            scripts[finalName] = content;
            localStorage.setItem('scripts', JSON.stringify(scripts));
            
            // Show success message
            const msg = document.getElementById('successMsg');
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 3000);
            
            document.getElementById('scriptName').value = '';
            document.getElementById('scriptContent').value = '';
            
            loadScripts();
        }

        function deleteScript(name) {
            if (confirm(`Delete ${name}?`)) {
                const scripts = JSON.parse(localStorage.getItem('scripts') || '{}');
                delete scripts[name];
                localStorage.setItem('scripts', JSON.stringify(scripts));
                loadScripts();
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('URL copied to clipboard!');
            });
        }

        // Check if URL is requesting a script
        function handleScriptRequest() {
            const path = window.location.pathname;
            const match = path.match(/\/scripts\/([^/]+)$/);
            
            if (match) {
                const scriptName = decodeURIComponent(match[1]);
                const scripts = JSON.parse(localStorage.getItem('scripts') || '{}');
                
                if (scripts[scriptName]) {
                    // Return plain text
                    document.body.innerHTML = '';
                    document.body.style.margin = '0';
                    document.body.style.padding = '0';
                    document.body.innerHTML = '<pre>' + scripts[scriptName] + '</pre>';
                    document.body.style.background = '#1e1e1e';
                    document.body.style.color = '#d4d4d4';
                    document.body.style.fontFamily = 'Consolas, Monaco, monospace';
                    document.body.style.whiteSpace = 'pre-wrap';
                    document.body.style.wordWrap = 'break-word';
                    document.body.style.padding = '20px';
                } else {
                    document.body.innerHTML = '<h1>Script not found: ' + scriptName + '</h1>';
                }
            } else {
                // Load the main page
                loadScripts();
            }
        }

        handleScriptRequest();
    </script>
</body>
</html>
