<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angelical Pastebin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
            border-bottom: 2px solid #404040;
        }
        h1 {
            color: #4ec9b0;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .tagline {
            color: #858585;
            font-size: 0.9em;
        }
        .upload-section {
            background: #252526;
            border: 1px solid #404040;
            border-radius: 5px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .upload-section h2 {
            color: #4ec9b0;
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        textarea {
            width: 100%;
            height: 300px;
            background: #1e1e1e;
            color: #d4d4d4;
            border: 1px solid #404040;
            border-radius: 4px;
            padding: 15px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 0.95em;
            resize: vertical;
            margin-bottom: 15px;
        }
        textarea:focus {
            outline: none;
            border-color: #4ec9b0;
            box-shadow: 0 0 5px rgba(78, 201, 176, 0.3);
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            background: #1e1e1e;
            color: #d4d4d4;
            border: 1px solid #404040;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            margin-bottom: 15px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #4ec9b0;
        }
        button {
            background: #4ec9b0;
            color: #1e1e1e;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            transition: background 0.3s;
        }
        button:hover {
            background: #6dd4c4;
        }
        .pastes-section {
            margin-top: 30px;
        }
        .pastes-section h2 {
            color: #4ec9b0;
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        .paste-item {
            background: #252526;
            border: 1px solid #404040;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background 0.3s, border-color 0.3s;
        }
        .paste-item:hover {
            background: #2d2d30;
            border-color: #4ec9b0;
        }
        .paste-title {
            color: #4ec9b0;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .paste-preview {
            color: #858585;
            font-size: 0.85em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .paste-meta {
            color: #646695;
            font-size: 0.8em;
            margin-top: 8px;
        }
        .empty-message {
            color: #858585;
            text-align: center;
            padding: 40px 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Angelical Pastebin</h1>
            <p class="tagline">Share and store code snippets, text, and more</p>
        </header>

        <div class="upload-section">
            <h2>Create New Paste</h2>
            <input type="text" id="pasteTitle" placeholder="Enter paste title (optional)">
            <textarea id="pasteContent" placeholder="Paste your content here..."></textarea>
            <button onclick="createPaste()">Create Paste</button>
        </div>

        <div class="pastes-section">
            <h2>Recent Pastes</h2>
            <div id="pastesList"></div>
        </div>
    </div>

    <script>
        // Load pastes from localStorage
        function loadPastes() {
            const pastesList = document.getElementById('pastesList');
            const pastes = JSON.parse(localStorage.getItem('pastes') || '[]');
            
            if (pastes.length === 0) {
                pastesList.innerHTML = '<div class="empty-message">No pastes yet. Create one above!</div>';
                return;
            }
            
            pastesList.innerHTML = pastes.map((paste, index) => `
                <div class="paste-item" onclick="viewPaste(${index})">
                    <div class="paste-title">${paste.title || 'Untitled Paste'}</div>
                    <div class="paste-preview">${paste.content.substring(0, 100)}</div>
                    <div class="paste-meta">Created: ${new Date(paste.timestamp).toLocaleString()}</div>
                </div>
            `).join('');
        }

        function createPaste() {
            const title = document.getElementById('pasteTitle').value;
            const content = document.getElementById('pasteContent').value;
            
            if (!content.trim()) {
                alert('Please enter some content!');
                return;
            }
            
            const pastes = JSON.parse(localStorage.getItem('pastes') || '[]');
            pastes.unshift({
                title: title || 'Untitled Paste',
                content: content,
                timestamp: new Date().toISOString()
            });
            
            localStorage.setItem('pastes', JSON.stringify(pastes));
            
            document.getElementById('pasteTitle').value = '';
            document.getElementById('pasteContent').value = '';
            
            loadPastes();
        }

        function viewPaste(index) {
            const pastes = JSON.parse(localStorage.getItem('pastes') || '[]');
            const paste = pastes[index];
            alert(`${paste.title}\n\n${paste.content}`);
        }

        // Load pastes on page load
        loadPastes();
    </script>
</body>
</html>
