<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angelical Scripts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            background: linear-gradient(135deg, #1a0033 0%, #330066 50%, #1a0033 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            color: #d4d4d4;
            min-height: 100vh;
            padding: 20px;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 50px;
            padding: 40px 0;
            animation: fadeInDown 0.8s ease;
        }
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        h1 {
            color: #ff1493;
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 20, 147, 0.5);
            letter-spacing: 2px;
            font-weight: bold;
        }
        .scripts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .script-card {
            background: rgba(40, 20, 60, 0.8);
            border: 2px solid #ff1493;
            border-radius: 12px;
            padding: 25px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            animation: slideIn 0.5s ease;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .script-card:hover {
            transform: translateY(-8px);
            border-color: #ff69b4;
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.4);
            background: rgba(50, 30, 80, 0.9);
        }
        .script-name {
            color: #ff1493;
            font-weight: bold;
            font-size: 1.3em;
            margin-bottom: 15px;
            word-break: break-word;
        }
        .script-url {
            color: #b8b8b8;
            font-size: 0.85em;
            margin-bottom: 15px;
            word-break: break-all;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 6px;
            border-left: 3px solid #ff1493;
        }
        .loadstring-code {
            background: #0a0a0a;
            color: #00ff00;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.75em;
            margin-bottom: 15px;
            word-break: break-all;
            border: 1px solid #333;
            font-family: 'Courier New', monospace;
            max-height: 100px;
            overflow-y: auto;
        }
        .script-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            flex: 1;
            min-width: 100px;
            background: linear-gradient(135deg, #ff1493 0%, #ff69b4 100%);
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            transition: all 0.3s ease;
            font-size: 0.85em;
        }
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.6);
        }
        button:active {
            transform: scale(0.95);
        }
        button.loadstring-btn {
            background: linear-gradient(135deg, #00ff00 0%, #00cc00 100%);
            color: #000;
        }
        button.loadstring-btn:hover {
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.6);
        }
        .empty-message {
            color: #ff1493;
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
        }
        .loading {
            color: #ff1493;
            text-align: center;
            padding: 40px;
            font-size: 1.1em;
        }
        .copy-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ff1493;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            z-index: 1000;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Please Copy Our Scripts Below!</h1>
        </header>
        <div class="scripts-grid" id="scriptsList">
            <div class="loading">Loading scripts...</div>
        </div>
    </div>

    <script>
        async function loadScripts() {
            try {
                const response = await fetch('https://api.github.com/repos/angelical-me/Angelical-me.github.io/contents/scripts');
                
                if (!response.ok) {
                    document.getElementById('scriptsList').innerHTML = '<div class="empty-message">No scripts available yet!</div>';
                    return;
                }
                
                const files = await response.json();
                const luaFiles = files.filter(f => f.name.endsWith('.lua'));
                
                if (luaFiles.length === 0) {
                    document.getElementById('scriptsList').innerHTML = '<div class="empty-message">No scripts available yet!</div>';
                    return;
                }
                
                const html = luaFiles.map((file, index) => {
                    const scriptName = file.name;
                    const scriptUrl = `https://angelical-me.github.io/scripts/${scriptName}`;
                    const loadstringCode = `loadstring(game:HttpGet("${scriptUrl}"))()`;
                    
                    return `
                        <div class="script-card" style="animation-delay: ${index * 0.1}s">
                            <div class="script-name">${scriptName}</div>
                            <div class="script-url">${scriptUrl}</div>
                            <div class="loadstring-code">${loadstringCode}</div>
                            <div class="script-actions">
                                <button class="loadstring-btn" onclick="copy('${loadstringCode.replace(/"/g, '&quot;')}')">Copy Loadstring</button>
                                <button onclick="copy('${scriptUrl}')">Copy URL</button>
                            </div>
                        </div>
                    `;
                }).join('');
                
                document.getElementById('scriptsList').innerHTML = html;
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('scriptsList').innerHTML = '<div class="empty-message">Error loading scripts</div>';
            }
        }
        
        function copy(text) {
            text = text.replace(/&quot;/g, '"');
            navigator.clipboard.writeText(text).then(() => {
                const notif = document.createElement('div');
                notif.className = 'copy-notification';
                notif.textContent = 'Copied!';
                document.body.appendChild(notif);
                setTimeout(() => notif.remove(), 2000);
            });
        }
        
        loadScripts();
    </script>
</body>
</html>
